# GitHub Actions — NEURAL_MESH CI
#
# These jobs run on GitHub-hosted runners. The repo is public, so that is free, and it
# is the only thing that works here: the box's self-hosted runner is registered against
# a *different* repository (BasedNUKEM/NEURAL_MESH), so a job asking for `self-hosted`
# in D0xedDevi0/NEURAL_MESH queues forever. Nothing ran between 2026-10-17 and
# 2026-11-26 because of it.
#
# To go back to self-hosted: register a runner against D0xedDevi0/NEURAL_MESH first
# (Settings -> Actions -> Runners, or config.sh with a repo registration token), then
# change these `runs-on` values back to `self-hosted`.

name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Core tests (unittest — pure stdlib, no deps)
        run: |
          PYTHONPATH=. python3 -m unittest tests.test_core tests.test_security tests.test_dream_provenance_guard tests.test_reputation tests.test_lanes tests.test_lifecycle tests.test_sharing tests.test_meshfile tests.test_cli_operations -v -q 2>&1

  server-tests:
    runs-on: ubuntu-latest
    needs: core-tests
    steps:
      - uses: actions/checkout@v4
      - name: Server tests
        run: |
          PYTHONPATH=. python3 -m unittest tests.test_server_lifecycle tests.test_server_operations -v 2>&1

  lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install flake8
        run: |
          python3 -m pip install --quiet --disable-pip-version-check flake8
      - name: Flake8 syntax checks
        run: |
          python3 -m flake8 neural_mesh/ server.py --count --select=E9,F63,F7,F82 --show-source --statistics 2>&1
      - name: Flake8 style (warnings)
        run: |
          python3 -m flake8 neural_mesh/ server.py --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics 2>&1
