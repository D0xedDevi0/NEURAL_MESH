# gitleaks config — narrow allowlist for D0xedDev repos.
# Installed by security-kit/scripts/install-into-repo.sh.
#
# CRITICAL: [extend] useDefault = true is REQUIRED.
# Supplying a --config file (or having .gitleaks.toml in the repo root, which gitleaks
# auto-detects) REPLACES the built-in ruleset. Without useDefault, a config that only
# defines an allowlist silently turns gitleaks into a no-op that reports "no leaks found"
# on everything. That exact mistake made the first version of this file pass a fake
# GitHub PAT — the fix is this [extend] block.

[extend]
useDefault = true

[allowlist]
description = "Known-benign key-shaped strings: public benchmark datasets + explicit test fixtures"

# Public datasets that embed third-party tokens (LoCoMo ships JWT-shaped strings inside
# dialogue records). Not our credentials, not usable — allowlisted by path only.
paths = [
  '''locomo[0-9_]*\.json$''',
  '''(^|/)tests?/fixtures?/''',
]

# Literals that self-identify as examples. Deliberately narrow: the variable name must
# contain test/fake/dummy/example/placeholder/sample AND be assigned a quoted value, so a
# real token in a real variable (GITHUB_TOKEN=..., API_KEY="...") still fails the scan.
regexes = [
  '''(?i)\b(test|fake|dummy|example|placeholder|sample)[_-]?(key|token|secret)\s*[:=]\s*["'][^"']{4,}["']''',
  '''AKIAIOSFODNN7EXAMPLE''',
  '''wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY''',
]